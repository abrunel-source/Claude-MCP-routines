services:
  postgres:
    image: postgres:15-alpine
    container_name: cadence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports:
      - '5432:5432'
    volumes:
      - cadence_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cadence -d cadence']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cadence_pgdata:
